<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <!-- ?v= changes on every build, so browsers fetch fresh CSS after each deploy. -->
  <link rel="stylesheet" href="/assets/css/style.css?v={{ site.time | date: '%s' }}">
</head>
