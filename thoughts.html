---
title: Thoughts
permalink: /thoughts/
---
<h1>Thoughts</h1>

{% assign thoughts = site.thoughts | sort: "date" | reverse %}
<ul class="post-list">
  {% for thought in thoughts %}
  <li>
    <time datetime="{{ thought.date | date_to_xmlschema }}">{{ thought.date | date: "%Y-%m-%d" }}</time>
    <a href="{{ thought.url }}">{{ thought.title | escape }}</a>
  </li>
  {% endfor %}
</ul>
